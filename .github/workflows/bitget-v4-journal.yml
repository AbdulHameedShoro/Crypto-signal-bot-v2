name: Bitget V4 Signals and Journal
"on":
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
concurrency:
  group: bitget-v4-journal
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-v4.txt
      - name: Run signal scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_WATCH: 'true'
        run: python bitget_signal_bot_v4.py
      
      - name: Save signal journal and de-duplication state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -f trade_journal/signals.csv ]; then
            git add trade_journal/signals.csv
          fi

          if [ -f v4_signal_state.json ]; then
            git add v4_signal_state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'Update V4 signal journal [skip ci]'
            git push
          fi
          
