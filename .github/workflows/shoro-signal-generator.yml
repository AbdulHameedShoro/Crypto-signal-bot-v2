name: Shoro Signal Generator

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  signal-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Check recent successful run
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow shoro-signal-generator.yml \
            --event schedule \
            --status success \
            --limit 1 \
            --json updatedAt \
            --jq '.[0].updatedAt // empty')

          if [ -n "$last" ]; then
            last_ts=$(date -d "$last" +%s)
            now_ts=$(date +%s)
            age=$((now_ts - last_ts))

            if [ "$age" -lt 1500 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "A successful scheduled run exists within 25 minutes."
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt requests

      - name: Run signal generator
        if: steps.guard.outputs.skip != 'true'
        run: |
          python shoro_signal_generator.py
