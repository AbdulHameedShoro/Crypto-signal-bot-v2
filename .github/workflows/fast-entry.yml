name: V4 Fast Entry Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-fast-entry-state
  cancel-in-progress: false

jobs:
  fast-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python -m pip install requests

      - name: Restore persistent alert state
        shell: bash
        run: |
          if git fetch origin fast-alert-state:refs/remotes/origin/fast-alert-state; then
            git show origin/fast-alert-state:fast_alert_state.json > fast_alert_state.json || rm -f fast_alert_state.json
          fi

      - name: Check fresh eligible entries only
        env:
          BOT_MODE: fast
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAST_STATE_FILE: fast_alert_state.json
        run: python main_combined_futures.py

      - name: Persist alert deduplication state
        shell: bash
        run: |
          if [ ! -f fast_alert_state.json ]; then
            echo 'No alert state to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/fast-alert-state; then
            git worktree add -B fast-alert-state /tmp/v4-fast-state origin/fast-alert-state
          else
            git worktree add --detach /tmp/v4-fast-state HEAD
            (
              cd /tmp/v4-fast-state
              git switch --orphan fast-alert-state
              git rm -rf --ignore-unmatch .
            )
          fi
          cp fast_alert_state.json /tmp/v4-fast-state/fast_alert_state.json
          cd /tmp/v4-fast-state
          git add fast_alert_state.json
          if git diff --cached --quiet; then
            echo 'State unchanged'
          else
            git commit -m 'Update V4 fast entry alert state'
            git push origin HEAD:fast-alert-state
          fi
