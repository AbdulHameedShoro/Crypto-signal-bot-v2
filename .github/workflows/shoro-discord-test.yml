name: SHORO Discord Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send test signal with trade buttons
        shell: bash
        env:
          WORKER_URL: https://shoro-bitget-trade-manager.ahshoro.workers.dev
          SIGNAL_SECRET: ${{ secrets.SHORO_SIGNAL_SECRET }}
        run: |
          set +x
          if [ -z "$SIGNAL_SECRET" ]; then
            echo "ERROR: GitHub secret SHORO_SIGNAL_SECRET is missing or empty."
            exit 1
          fi

          STATUS=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            --url "$WORKER_URL/shoro-signal" \
            --header "X-SHORO-SIGNAL-SECRET: $SIGNAL_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"pair":"TESTUSDT","side":"BUY","entry":100,"stop_loss":90,"tp1":110,"tp2":120,"tp3":130}')

          echo "HTTP_STATUS=$STATUS"
          echo "RESPONSE:"
          cat response.json
          echo

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Signal endpoint did not return HTTP 200."
            exit 1
          fi

          python - <<'PY'
          import json, sys
          with open('response.json', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('ok') is not True:
              sys.exit('ERROR: Worker did not confirm success.')
          if data.get('duplicate') is True:
              print('Duplicate test signal: no new Discord message was sent.')
          elif data.get('discordStatus') == 200:
              print('Discord API accepted the test signal message.')
          else:
              sys.exit('ERROR: Discord message delivery not confirmed.')
          PY
