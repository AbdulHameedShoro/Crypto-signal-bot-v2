name: Bitget V4 Signal Bot (Manual Test)

on:
  workflow_dispatch:
  # Enable only after manual tests; GitHub cron may be delayed.
  # schedule:
  #   - cron: '2,17,32,47 * * * *'

permissions:
  contents: read

concurrency:
  group: bitget-v4-signals
  cancel-in-progress: false

jobs:
  run-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-v4.txt
      - name: Run V4 signals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_WATCH: 'true'
        run: python bitget_signal_bot_v4.py
